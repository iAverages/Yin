[workspace]
resolver = "3"
members = [
    "crates/api",
    "crates/bot",
    "crates/bot-core",
    "crates/database",
    "crates/feature-admin",
    "crates/feature-endfield",
    "crates/feature-flags",
    "crates/feature-guilds",
    "crates/feature-info",
    "crates/feature-settings",
    "crates/feature-social",
    "crates/migrate",
]

[workspace.dependencies]
api = { path = "crates/api" }
bot-core = { path = "crates/bot-core" }
database = { path = "crates/database" }
feature-admin = { path = "crates/feature-admin" }
feature-endfield = { path = "crates/feature-endfield" }
feature-flags = { path = "crates/feature-flags" }
feature-guilds = { path = "crates/feature-guilds" }
feature-info = { path = "crates/feature-info" }
feature-settings = { path = "crates/feature-settings" }
feature-social = { path = "crates/feature-social" }

axum = "0.8"
posthog-rs = { version = "0.27", default-features = false, features = ["async-client"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sea-query = { version = "0.32", features = ["backend-mysql", "derive"] }
sea-query-binder = { version = "0.7", features = ["sqlx-mysql"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "uuid", "chrono", "json", "migrate"] }
thiserror = "2"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
twilight-cache-inmemory = "0.18"
twilight-gateway = "0.18"
twilight-http = "0.18"
twilight-interactions = "0.18"
twilight-model = "0.18"
twilight-util = { version = "0.18", features = ["builder", "snowflake"] }
uuid = { version = "1", features = ["v7"] }
