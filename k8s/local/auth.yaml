apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: yin-dev
spec:
  selector:
    app.kubernetes.io/name: auth
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: yin-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
    spec:
      containers:
        - name: auth
          image: yin-auth-dev
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command: ["pnpm", "--filter", "@yin/auth", "dev"]
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: yin-config
            - secretRef:
                name: yin-secrets
