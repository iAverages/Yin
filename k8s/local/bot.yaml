apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  namespace: yin-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bot
    spec:
      containers:
        - name: bot
          image: yin-rust-dev
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command:
            - cargo
            - watch
            - --watch
            - Cargo.toml
            - --watch
            - Cargo.lock
            - --watch
            - crates/bot
            - --watch
            - crates/bot-core
            - --watch
            - crates/database
            - --watch
            - crates/feature-admin
            - --watch
            - crates/feature-endfield
            - --watch
            - crates/feature-info
            - --watch
            - crates/feature-moderation
            - --watch
            - crates/feature-settings
            - --exec
            - run -p bot
          envFrom:
            - configMapRef:
                name: yin-config
            - secretRef:
                name: yin-secrets
          volumeMounts:
            - name: rust-target
              mountPath: /workspace/target
      volumes:
        - name: rust-target
          hostPath:
            path: /var/lib/yin-dev/cargo-target/bot
            type: DirectoryOrCreate
