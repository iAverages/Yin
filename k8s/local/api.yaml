apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: yin-dev
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: yin-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: api
          image: yin-rust-dev
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command: ["cargo", "watch", "-x", "run -p api"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: yin-config
          volumeMounts:
            - name: rust-target
              mountPath: /workspace/target
      volumes:
        - name: rust-target
          emptyDir: {}
